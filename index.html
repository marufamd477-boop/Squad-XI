
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>CrownBoard - Chess & Checkers</title>

  <!-- Google Analytics GA4 -->
  <script async
    src="https://www.googletagmanager.com/gtag/js?id=G-2QBJH4J3P1">
  </script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2QBJH4J3P1');
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #182338,
        #394d6a,
        #182338
      );
      color: white;
    }

    .container {
      text-align: center;
      padding: 24px;
      width: 100%;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 32px;
    }

    .glass-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 19px 25px;
      max-width: 100%;
      border-radius: 22px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;

      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.4);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 26px rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.2);

      transition: transform 0.15s ease;
    }

    .glass-button:active {
      transform: scale(0.95);
    }

    .glass-button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Opening CrownBoard...</h2>
    <p>Redirecting to Google Play Store...</p>

    <a
      class="glass-button"
      href="https://play.google.com/store/apps/details?id=com.tap.crownboard"
    >
      ♟ Tap here to open the app ↗
    </a>
  </main>

  <script>
    const destination =
      "https://play.google.com/store/apps/details?id=com.tap.crownboard";

    setTimeout(() => {
      window.location.replace(destination);
    }, 15000);
  </script>
</body>
</html>
